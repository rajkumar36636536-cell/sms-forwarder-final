name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          mkdir -p temp_extract
          unzip -o sms-forwarder-github.zip -d temp_extract
          TARGET_DIR=$(find temp_extract -name "package.json" -exec dirname {} \; | head -n 1)
          echo "Found project root in: $TARGET_DIR"
          cp -r "$TARGET_DIR"/* .
          rm -rf temp_extract

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sanitize Dependencies & Fix Entry
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("package.json")) process.exit(0);
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const clean = (deps) => {
              if (!deps) return;
              for (const k of Object.keys(deps)) {
                if (k.startsWith("@workspace/") || String(deps[k]).includes("workspace:")) {
                  delete deps[k];
                } else if (String(deps[k]).startsWith("catalog:")) {
                  deps[k] = "*";
                }
              }
            };
            clean(pkg.dependencies);
            clean(pkg.devDependencies);
            pkg.main = "expo-router/entry";
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
          grep -rl "@workspace/" . --exclude-dir={.git,.github,node_modules} 2>/dev/null | xargs -r sed -i 's|@workspace/[^"\x27]*|react|g' || true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Prebuild Clean Android
        run: CI=1 npx expo prebuild --platform android --clean --no-install

      - name: Generate Offline JS Bundle
        run: |
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res
          # Expo router entry bundle generate
          npx expo export:embed \
            --platform android \
            --dev false \
            --entry-file node_modules/expo-router/entry.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res || \
          npx @react-native-community/cli bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res || true

      - name: Build Android Release APK
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          ln -sf "${{ github.workspace }}/node_modules" android/node_modules || true
          cd android
          echo "org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m" >> gradle.properties
          echo "reactNativeArchitectures=arm64-v8a" >> gradle.properties
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -PbundleInRelease=false \
            -x bundleReleaseJsAndAssets \
            -x createBundleReleaseJsAndAssets \
            -x lint \
            -x test \
            --info \
            --no-daemon

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-forwarder-app
          path: android/app/build/outputs/apk/release/*.apk
