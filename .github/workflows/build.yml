name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          mkdir -p temp_extract
          unzip -o sms-forwarder-github.zip -d temp_extract
          TARGET_DIR=$(find temp_extract -name "package.json" -exec dirname {} \; | head -n 1)
          echo "Found project root in: $TARGET_DIR"
          cp -r "$TARGET_DIR"/* .
          rm -rf temp_extract

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sanitize Dependencies & Fix Entry
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("package.json")) process.exit(0);
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const clean = (deps) => {
              if (!deps) return;
              for (const k of Object.keys(deps)) {
                if (k.startsWith("@workspace/") || String(deps[k]).includes("workspace:")) {
                  delete deps[k];
                } else if (String(deps[k]).startsWith("catalog:")) {
                  deps[k] = "*";
                }
              }
            };
            clean(pkg.dependencies);
            clean(pkg.devDependencies);
            pkg.main = "expo-router/entry";
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));

            if (fs.existsSync("app.json")) {
              const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
              if (app.expo && Array.isArray(app.expo.plugins)) {
                app.expo.plugins = app.expo.plugins.filter(p => {
                  const name = Array.isArray(p) ? p[0] : p;
                  return typeof name === "string" && !name.includes("expo-max-sdk-override");
                });
                fs.writeFileSync("app.json", JSON.stringify(app, null, 2));
              }
            }
          '
          grep -rl "@workspace/" . --exclude-dir={.git,.github,node_modules} 2>/dev/null | xargs -r sed -i 's|@workspace/[^"\x27]*|react|g' || true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --save-dev expo-modules-autolinking --legacy-peer-deps || true

      - name: Prebuild Clean Android
        run: CI=1 npx expo prebuild --platform android --clean --no-install

      - name: Build Android Release APK
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          # Ensure node can resolve modules from root
          mkdir -p android/app/src/main/java/expo/modules
          mkdir -p /tmp/node_modules
          
          # Intercept node calls to log errors if any fail during gradle
          REAL_NODE=$(which node)
          cat << 'EOF' > /tmp/node_wrapper.sh
          #!/bin/bash
          OUTPUT=$("$REAL_NODE_BIN" "$@" 2>&1)
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "==== FAILED NODE COMMAND: $REAL_NODE_BIN $@ ===="
            echo "$OUTPUT"
            echo "================================================"
            # If it is the non-fatal mirror-kotlin command, don't break the build
            if [[ "$*" == *"mirror-kotlin-inline-modules"* ]]; then
              exit 0
            fi
            exit $STATUS
          fi
          echo "$OUTPUT"
          exit 0
          EOF
          sed -i "s|\$REAL_NODE_BIN|$REAL_NODE|g" /tmp/node_wrapper.sh
          chmod +x /tmp/node_wrapper.sh
          
          # Put wrapper in PATH ahead of real node
          mkdir -p /tmp/bin
          ln -s /tmp/node_wrapper.sh /tmp/bin/node
          export PATH="/tmp/bin:$PATH"

          cd android
          echo "org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m" >> gradle.properties
          echo "reactNativeArchitectures=arm64-v8a" >> gradle.properties
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -x lint \
            -x test \
            --no-daemon

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-forwarder-app
          path: android/app/build/outputs/apk/release/*.apk
